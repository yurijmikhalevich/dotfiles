# Tab management
enabled_layouts splits,stack

map cmd+left previous_tab
map cmd+right next_tab
map shift+cmd+left move_tab_backward
map shift+cmd+right move_tab_forward
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Split management
map cmd+w close_window
map cmd+d launch --location=vsplit
map shift+cmd+d launch --location=hsplit
map shift+cmd+9 launch --location=vsplit
map shift+cmd+0 launch --location=hsplit
map alt+cmd+left neighboring_window left
map alt+cmd+right neighboring_window right
map alt+cmd+up neighboring_window top
map alt+cmd+down neighboring_window bottom
map cmd+[ previous_window
map cmd+] next_window
map shift+cmd+up previous_window
map shift+cmd+down next_window
map shift+cmd+enter toggle_layout stack

map cmd+enter toggle_fullscreen
