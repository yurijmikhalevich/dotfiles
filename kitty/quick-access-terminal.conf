# Use the normal Kitty configuration, including its shortcuts.
background_opacity 1.0
lines 648px
kitty_conf kitty.conf

# Keep the panel below macOS notification banners (window level 21) and the
# input-method candidate window (level 20), but above normal windows.
# Kitty panels otherwise default to NSPopUpMenuWindowLevel - 1 (level 100),
# which covers notifications.
kitty_override macos_ns_window_layer=kCGUtilityWindowLevel

tab_bar_min_tabs 1
